name: git-agent-orchestrator
run-name: "orchestrator-${{ github.event.inputs.task_id }}"

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Unique task UUID'
        required: true
      task:
        description: 'Task description'
        required: true
      max_workers:
        description: 'Wait for up to N workers concurrently (0 = use CI default)'
        required: false
        default: '0'
      max_iterations:
        description: 'Max orchestrator loop iterations (0 = use default of 3)'
        required: false
        default: '0'

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.ORCHESTRATOR_IMAGE || 'ghcr.io/myuser/git-agent-orchestrator:latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Run orchestrator
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'ollama' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'llama3.2' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          TASK: ${{ github.event.inputs.task }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers }}
          MAX_ITERATIONS: ${{ github.event.inputs.max_iterations }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BASE_BRANCH: ${{ github.ref_name }}
          PLATFORM: github
          # Set to "true" if using a PAT token and you want the LLM to self-modify your CI workflows
          ALLOW_WORKFLOW_EDITS: "false"
        run: |
          orchestrator

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-summary
          path: orchestrator-summary.json
          retention-days: 7
